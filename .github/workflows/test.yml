name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Check coverage thresholds
        run: |
          echo "Verificando umbrales de cobertura..."
          COVERAGE=$(jq '.total.statements.pct' coverage/coverage-summary.json)
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "La cobertura de pruebas está por debajo del umbral: $COVERAGE% < 80%"
            exit 1
          else
            echo "Cobertura de pruebas: $COVERAGE% (Umbral: 80%)"
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-coverage
          message: |
            ## Cobertura de Pruebas
            
            Resultados de cobertura para este PR:
            
            ```
            $(cat coverage/coverage-summary.txt)
            ```
            
            [Ver reporte completo](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) 